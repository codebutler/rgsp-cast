[package]
name = "rgsp-ui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
jsonrpsee = { version = "0.26.0", default-features = false, features = ["async-client", "macros"] }
reth-ipc = { path = "../vendor/reth-ipc" }
sdl2-sys = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
bindgen = "0.72"
cc = "1"
pkg-config = "0.3"
