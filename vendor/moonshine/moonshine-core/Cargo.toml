[package]
name = "moonshine-core"
version = "0.15.0"
edition = "2024"

# Trimmed relative to upstream: the subsystems these belonged to are deleted
# here (see the vendoring notes in README.md), so nothing referenced them.
# Removed, with what took them out:
#
#   calloop, mio, mio-timerfd     session/compositor (Wayland + DRM/GBM)
#   dasp                          session/stream/audio/pulse_server
#   walkdir, which, shlex         app_scanner (Steam/Heroic/Lutris/.desktop)
#   rusqlite (bundled)            never used here - state.rs writes state.toml
#                                 via `toml`. Dropping it also drops
#                                 libsqlite3-sys, which compiles the SQLite
#                                 amalgamation with cc on every clean build.
#   bitflags, byteorder, futures-util, libc, serde_json, tempfile
#                                 assorted, all orphaned by the above
#
# Verified by `cargo test --workspace` in the arm64 container, not by grep:
# 299 -> 264 crates in Cargo.lock. If a `git subtree pull` reinstates any of
# these, that is a regression to undo, not an upstream improvement to keep -
# unless it also restores the subsystem that needs it.
[dependencies]
aes = "0.9.1"
aes-gcm = "0.10.3"
async-shutdown = "0.2.2"
aws-lc-rs = "1.17.0"
bytes = "1.11.1"
cbc = "0.2.1"
crossbeam-channel = "0.5.15"
dirs = "6.0.0"
fec-rs = { version = "0.1.0", features = ["parallel"] }
gethostname = "1.1.0"
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
inout = "0.2.2"
mdns-sd = "0.20.0"
network-interface = "2.0.5"
opus = "0.3.1"
pkcs8 = "0.11.0"
rcgen = "0.14.8"
rsa = "0.9.10"
rtsp-types = "0.1.3"
rustls = "0.23.40"
rustls-pemfile = "2.2.0"
sdp-types = "0.1.8"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
shellexpand = "3.1.2"
quinn-udp = "0.6.1"
socket2 = "0.6.4"
strum_macros = "0.28.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "tracing"] }
tokio-enet = "0.1.0"
tokio-rustls = "0.26.4"
toml = "1.1.2"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
